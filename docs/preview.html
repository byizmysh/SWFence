<!doctype html>

<main><div class="preview">SWFence interface preview — simulated live data, no router connected.</div><div id="notifications"></div><div id="app">Loading view…</div></main>
<script>
const E=(tag,attrs,children)=>{const el=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='click')el.addEventListener('click',v);else if(k==='disabled')el.disabled=!!v;else el.setAttribute(k,v)}for(const c of (children==null?[]:Array.isArray(children)?children:[children]))el.append(c instanceof Node?c:document.createTextNode(String(c)));return el;};
const types={Flag:'flag',DynamicList:'list',Value:'value',NamedSection:'named'};
class JSONMap{
 constructor(data,title,description){this.values=structuredClone(data);this.title=title;this.description=description;this.options=[];this.data={get:(_,key)=>this.values[key]};}
 section(){return{option:(type,key,label,description)=>{const o={type,key,label,description,depends:(dep,value)=>{o.dependency={dep,value};}};this.options.push(o);return o;}};}
 render(){const fields=this.options.filter(o=>!o.dependency || (this.values.main[o.dependency.dep]||'')===o.dependency.value).map(o=>{const current=this.values.main[o.key];let input;if(o.type==='flag'){input=E('input',{type:'checkbox'});input.checked=current==='1';input.onchange=()=>this.values.main[o.key]=input.checked?'1':'0';}else{input=E(o.type==='list'?'textarea':'input',{type:'text'});input.value=Array.isArray(current)?current.join('\n'):(current||'');input.placeholder=o.placeholder||'';input.oninput=()=>this.values.main[o.key]=o.type==='list'?input.value.trim().split(/\s+/):input.value;}return E('div',{class:'field'},[E('label',{},o.label),input,o.description?E('small',{},o.description):'']);});return Promise.resolve(E('section',{class:'formmap'},[...(this.title?[E('h2',{},this.title)]:[]),E('p',{},this.description),E('div',{class:'fields'},fields)]));}
 save(fn){return Promise.resolve().then(fn);}
}
const previewDay=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let state={version:'0.3.0',preview:true,project_url:'',domain_status:{state:'not_configured'},configuration_valid:true,configured_enabled:true,guard_present:true,config_matches:true,dns_running:true,http_running:true,last_error:'',counters:{bridge_dropped:'148',inet_dropped:'23'},daily_counters:{available:true,day:previewDay(),timezone:'MSK +0300',collected_since:'demo-midnight',collected_since_local:previewDay()+' 00:00:00 MSK',bridge_dropped:'148',inet_dropped:'23'},config:{enabled:'1',macs:['02:00:00:00:00:11','02:00:00:00:00:12'],router_ip:'192.168.50.1',lan_subnet:'192.168.50.0/24',local_host:'',local_port:'',allowed_domains:[],allowed_ips:[]}};
const rpc={declare:desc=>(...args)=>{if(desc.method==='status'){if(state.daily_counters.day!==previewDay()){state.daily_counters.day=previewDay();state.daily_counters.collected_since_local=previewDay()+' 00:00:00 MSK';state.daily_counters.bridge_dropped='0';state.daily_counters.inet_dropped='0';}state.daily_counters.bridge_dropped=String(Number(state.daily_counters.bridge_dropped)+2);state.daily_counters.inet_dropped=String(Number(state.daily_counters.inet_dropped)+1);state.counters.bridge_dropped=String(Number(state.counters.bridge_dropped)+2);state.counters.inet_dropped=String(Number(state.counters.inet_dropped)+1);return Promise.resolve(structuredClone(state));}if(desc.method==='diagnostics')return Promise.resolve({scope:'Router-local checks only; not an end-to-end console isolation test.',checks:[{name:'Configuration',result:'pass',detail:'Configured MACs and LAN are valid.'},{name:'Firewall rules',result:'pass',detail:'Both guard chains are loaded.'},{name:'Local DNS',result:'pass',detail:'Local answer and NXDOMAIN behavior match the expected policy.'},{name:'Connection check',result:'pass',detail:'Local HTTP endpoint returns ok.'},{name:'console_external_isolation',result:'manual',detail:'Verify from the console and observe blocked-packet counters.'}]});return new Promise(resolve=>setTimeout(()=>{state.config={enabled:args[0],macs:args[1].split(/\s+/).filter(Boolean),router_ip:args[2],lan_subnet:args[3],local_host:args[4],local_port:args[5],allowed_ips:args[6].split(/\s+/).filter(Boolean),allowed_domains:args[7].split(/\s+/).filter(Boolean)};state.configured_enabled=args[0]==='1';state.guard_present=state.configured_enabled;state.dns_running=state.configured_enabled;state.http_running=state.configured_enabled;state.domain_status=state.config.allowed_domains.length?{state:'updated',resolved:String(state.config.allowed_domains.length),unresolved:'0'}:{state:'not_configured'};resolve({ok:true,message:'Demo settings applied; no router was changed.'});},900));}};
const dom={content:(el,children)=>{el.replaceChildren();for(const c of (Array.isArray(children)?children:[children]))el.append(c);}};
const ui={createHandlerFn:(owner,fn)=>function(event){const button=event.currentTarget;button.disabled=true;button.classList.add('spinning');return Promise.resolve().then(()=>fn.call(owner,event)).finally(()=>{button.disabled=false;button.classList.remove('spinning');});},addNotification:(_,node)=>document.getElementById('notifications').replaceChildren(E('div',{class:'notification'},node))};
fetch('../packages/luci-app-swfence/htdocs/luci-static/resources/view/swfence/overview.js').then(r=>r.text()).then(code=>{const app=new Function('view','form','rpc','poll','ui','dom','E','_','L',code)({extend:x=>x},{JSONMap,...types},rpc,{add:(fn,secs)=>setInterval(fn,secs*1000)},ui,dom,E,x=>x,{hasViewPermission:()=>true});return app.load().then(data=>app.render(data));}).then(node=>document.getElementById('app').replaceChildren(node)).catch(error=>document.getElementById('app').textContent=error.message);
</script></html>
