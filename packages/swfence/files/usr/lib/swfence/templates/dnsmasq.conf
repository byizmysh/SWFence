# Separate resolver: local answers and resolved exact exceptions; no forwarding.
port=5357
listen-address=@ROUTER_IP@
bind-interfaces
no-resolv
no-hosts
addn-hosts=/var/run/swfence/allowed-hosts
no-poll
cache-size=0
local-ttl=30
address=/#/
host-record=ctest.p01.ctest.srv.nintendo.net,@ROUTER_IP@
host-record=ctest-ipv6.p01.ctest.srv.nintendo.net,@ROUTER_IP@
host-record=ctest.cdn.nintendo.net,@ROUTER_IP@
host-record=conntest.nintendowifi.net,@ROUTER_IP@
log-queries=extra
log-facility=-
